<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>

    <!-- 스프링서버 실행 후: http://127.0.0.1:8080/practice/index.html -->
    <h3> 스프링(톰캣)서버에서 실행되는 페이지(HTML) </h3>
    <div> <!-- 레이아웃(구역)-->
        전화번호: <input type="text" class="number" /> <br/> 
            <!-- input입력상자, br줄바꿈 , class:마크업의식별자(복수) , id:마크업의식별자(단일) -->
        인원수: <input type="text" class="people" /> <br/>
        <button onclick="listSave()"> 등록 </button> 
            <!-- button클릭상자 , onclick="JS함수()"  : 해당 마크업을 클릭시 JS함수 발동  -->
    </div>
    <div>
        <table border="1"> <!-- 테이블 -->
            <thead> <!-- 제목구역 -->
                <tr> <!-- 행 -->
                    <th> 전화번호 </th> <th> 인원수 </th> <th> 비고 </th> <!-- 제목셀 -->
                </tr>
            </thead>
            <tbody class="listList"> <!-- 본문구역-->
                <tr>
                    <td> 010-1234-5678 </td> <td> 4 </td> 
                    <td> <button onclick="listUpdate()">수정</button> <button onclick="listDelete()">삭제</button> </td> <!-- 데이터셀(한칸)-->
                </tr>
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="index.js"></script>
</body>
</html>
