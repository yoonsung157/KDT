spring.application.name=springweb

# 주석 : .properties 파일의 주석 방법
# application.properties 파일이란? spring 관련 설정 코드 입력하는곳
# 1. 내장 톰캣의 포트 번호 변경, 기본값이 8080
server.port = 8080 
# 2. 데이터베이스 연동
# 2.1 연동할 DB 주소
spring.datasource.url = jdbc:mysql://localhost:3306/mydb0903
# 2.2 DB주소의 계정명/비밀번호
spring.datasource.username = root
spring.datasource.password = 1234
# 3. DDL
# create : 서버 실행될때 엔티티 기반으로 테이블을 삭제후 생성
# create-drop : 서버 실행될때 엔티티 기반으로 테이블 생성, 서버 종료시 삭제
# update : 서버 실행될때 존재하면 엔티티 수정, 없으면 생성
# none : 사용 안 함
spring.jpa.hibernate.ddl-auto=create-drop

# 4. 콘솔에서 SQL 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5. 자바 실행될 때 (DML)data.sql (경로) 파일 실행, classpath(resource폴더):
spring.sql.init.data-locations=classpath:/sql/practice3.sql 
spring.jpa.defer-datasource-initialization= true
spring.sql.init.mode=always

# SQL 스크립트 인코딩 지정(한글 깨짐 방지)
spring.sql.init.encoding=UTF-8