plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'springweb'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// 1. springboot
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 2. MySQL jdbc
	runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 3. Lombok
	compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

	// 4. JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Build and run only the practice5_1 exercise.
def practice51Compile = tasks.register('compilePractice51', JavaCompile) {
    source = fileTree('src/main/java') {
        include 'example/practice5_1/**/*.java'
    }
    classpath = configurations.compileClasspath
    options.annotationProcessorPath = configurations.annotationProcessor
    options.encoding = 'UTF-8'
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    destinationDirectory = layout.buildDirectory.dir('classes/practice51')
}

tasks.register('runPractice51', JavaExec) {
    group = 'application'
    description = 'Compile and run only example.practice5_1.AppStart'
    dependsOn practice51Compile
    mainClass = 'example.practice5_1.AppStart'
    classpath = files(practice51Compile.flatMap { it.destinationDirectory }, 'src/main/resources') + configurations.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    standardInput = System.in
}
